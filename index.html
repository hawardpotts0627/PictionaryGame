<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1325" />
    <title>スマホ・ピクショナリー</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="hero">
        <div>
          <p class="kicker">Pictionary deck</p>
          <h1>スマホ・ピクショナリー</h1>
        </div>
        <button class="icon-button" id="themeButton" type="button" aria-label="色を切り替える">◎</button>
      </section>

      <section class="turn-card" aria-live="polite">
        <div class="turn-top">
          <div>
            <p class="label">現在のチーム</p>
            <h2 id="currentTeam">赤チーム</h2>
          </div>
          <div class="round-pill" id="roundStatus">∞</div>
        </div>

        <div class="timer-row">
          <button class="timer" id="timerButton" type="button" aria-label="タイマー開始">
            <span id="timeLeft">02:00</span>
            <small id="timerHint">タップで開始</small>
          </button>
          <button class="give-up" id="giveUpButton" type="button">ギブアップ</button>
        </div>

        <article class="prompt" id="promptPanel">
          <p id="promptCategory">タイマー開始後にカードを引けます</p>
          <h3 id="promptText">準備中</h3>
          <div class="prompt-meta">
            <span id="promptDifficulty">未開始</span>
            <strong id="promptScore">0点</strong>
          </div>
        </article>

        <button class="primary" id="drawButton" type="button" disabled>カードを引く</button>
        <button class="secondary" id="nextButton" type="button">次のチームへ</button>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="label">このターンで引いたカード</p>
            <h2><span id="turnCount">0</span>/<span id="turnLimit">8</span> 枚</h2>
          </div>
          <span class="subtle">得点したカードをタップ</span>
        </div>
        <div class="drawn-list" id="drawnList"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="label">ランキング</p>
            <h2 id="leaderTitle">赤チームが先攻</h2>
          </div>
        </div>
        <div class="scoreboard" id="scoreboard"></div>
      </section>

      <details class="host">
        <summary>ホスト設定・カード編集</summary>
        <div class="host-grid">
          <label>チーム数
            <input id="teamCountInput" type="number" min="2" max="8" value="3" />
          </label>
          <label>1ターンの上限
            <input id="limitInput" type="number" min="1" max="30" value="8" />
          </label>
          <label>制限時間（秒）
            <input id="timeInput" type="number" min="15" max="600" value="120" />
          </label>
          <label>ラウンド数
            <select id="roundInput">
              <option value="0">無限</option>
              <option value="1">1周</option>
              <option value="2">2周</option>
              <option value="3">3周</option>
              <option value="5">5周</option>
            </select>
          </label>
        </div>
        <div class="host-actions">
          <button id="applySettings" type="button">設定を反映</button>
          <button id="resetGame" type="button">ゲームをリセット</button>
        </div>

        <div class="team-editor">
          <p class="label">チーム名</p>
          <div id="teamNameList"></div>
        </div>

        <div class="library">
          <div class="panel-head">
            <div>
              <p class="label">カードリスト</p>
              <h2><span id="libraryCount">999</span> 枚</h2>
            </div>
          </div>
          <input id="cardSearch" type="search" placeholder="カード検索" />
          <div class="card-form">
            <input id="newCardText" type="text" placeholder="追加するお題" />
            <select id="newCardCategory"></select>
            <select id="newCardScore"></select>
            <button id="addCard" type="button">追加</button>
          </div>
          <div class="library-list" id="libraryList"></div>
        </div>
      </details>
    </main>
    <script src="app.js"></script>
  </body>
</html>
